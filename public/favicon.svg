<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
    <radialGradient id="favHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="70%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#92400E" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#064E3B" />
      <stop offset="100%" stopColor="#022C22" />
    </linearGradient>
  </defs>

  {/* Background Rounded Shield */}
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="#F59E0B" strokeWidth="2" strokeOpacity="0.4" fill="none" />

  {/* Outer Rim Bands */}
  <circle cx="50" cy="50" r="40" stroke="url(#favGold)" strokeWidth="2.5" />
  <circle cx="50" cy="50" r="36" stroke="url(#favGold)" strokeWidth="1.2" opacity="0.8" />

  {/* 16 Outer Rim Studs */}
  <circle cx="50" cy="12" r="1.8" fill="#FEF08A" />
  <circle cx="64.5" cy="15.8" r="1.8" fill="#FEF08A" />
  <circle cx="76.8" cy="26.2" r="1.8" fill="#FEF08A" />
  <circle cx="84.2" cy="40.5" r="1.8" fill="#FEF08A" />
  <circle cx="86.8" cy="50" r="1.8" fill="#FEF08A" />
  <circle cx="84.2" cy="59.5" r="1.8" fill="#FEF08A" />
  <circle cx="76.8" cy="73.8" r="1.8" fill="#FEF08A" />
  <circle cx="64.5" cy="84.2" r="1.8" fill="#FEF08A" />
  <circle cx="50" cy="88" r="1.8" fill="#FEF08A" />
  <circle cx="35.5" cy="84.2" r="1.8" fill="#FEF08A" />
  <circle cx="23.2" cy="73.8" r="1.8" fill="#FEF08A" />
  <circle cx="15.8" cy="59.5" r="1.8" fill="#FEF08A" />
  <circle cx="13.2" cy="50" r="1.8" fill="#FEF08A" />
  <circle cx="15.8" cy="40.5" r="1.8" fill="#FEF08A" />
  <circle cx="23.2" cy="26.2" r="1.8" fill="#FEF08A" />
  <circle cx="35.5" cy="15.8" r="1.8" fill="#FEF08A" />

  {/* Inner Track Ring */}
  <circle cx="50" cy="50" r="24" stroke="url(#favGold)" strokeWidth="1.5" opacity="0.9" />

  {/* 8 Primary Spoke Beams with Medallions */}
  {/* 0 deg (Up) */}
  <line x1="50" y1="37" x2="50" y2="14" stroke="url(#favGold)" strokeWidth="3" strokeLinecap="round" />
  <circle cx="50" cy="26" r="3" fill="url(#favHub)" stroke="#78350F" strokeWidth="0.8" />

  {/* 45 deg */}
  <line x1="59.2" y1="40.8" x2="75.5" y2="24.5" stroke="url(#favGold)" strokeWidth="3" strokeLinecap="round" />
  <circle cx="67" cy="33" r="3" fill="url(#favHub)" stroke="#78350F" strokeWidth="0.8" />

  {/* 90 deg (Right) */}
  <line x1="63" y1="50" x2="86" y2="50" stroke="url(#favGold)" strokeWidth="3" strokeLinecap="round" />
  <circle cx="74" cy="50" r="3" fill="url(#favHub)" stroke="#78350F" strokeWidth="0.8" />

  {/* 135 deg */}
  <line x1="59.2" y1="59.2" x2="75.5" y2="75.5" stroke="url(#favGold)" strokeWidth="3" strokeLinecap="round" />
  <circle cx="67" cy="67" r="3" fill="url(#favHub)" stroke="#78350F" strokeWidth="0.8" />

  {/* 180 deg (Down) */}
  <line x1="50" y1="63" x2="50" y2="86" stroke="url(#favGold)" strokeWidth="3" strokeLinecap="round" />
  <circle cx="50" cy="74" r="3" fill="url(#favHub)" stroke="#78350F" strokeWidth="0.8" />

  {/* 225 deg */}
  <line x1="40.8" y1="59.2" x2="24.5" y2="75.5" stroke="url(#favGold)" strokeWidth="3" strokeLinecap="round" />
  <circle cx="33" cy="67" r="3" fill="url(#favHub)" stroke="#78350F" strokeWidth="0.8" />

  {/* 270 deg (Left) */}
  <line x1="37" y1="50" x2="14" y2="50" stroke="url(#favGold)" strokeWidth="3" strokeLinecap="round" />
  <circle cx="26" cy="50" r="3" fill="url(#favHub)" stroke="#78350F" strokeWidth="0.8" />

  {/* 315 deg */}
  <line x1="40.8" y1="40.8" x2="24.5" y2="24.5" stroke="url(#favGold)" strokeWidth="3" strokeLinecap="round" />
  <circle cx="33" cy="33" r="3" fill="url(#favHub)" stroke="#78350F" strokeWidth="0.8" />

  {/* Center Axle Hub */}
  <circle cx="50" cy="50" r="13" fill="url(#favHub)" stroke="#78350F" strokeWidth="1.5" />
  <circle cx="50" cy="50" r="6" fill="#78350F" opacity="0.4" />

  {/* Temple Shikhara Accent */}
  <path d="M 50 43 L 54 51 L 46 51 Z" fill="#FFFFFF" />
  <circle cx="50" cy="41" r="1.5" fill="#FEF08A" />
</svg>